<style>

}
@media (prefers-color-scheme: dark) {

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-size: 12px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }

/* header */
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { font-size: 15px; font-weight: 650; letter-spacing: -.01em; text-decoration: none; display: flex; align-items: center; gap: 8px; }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--border);

.chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
.chip:hover { background: var(--hover); }
.chip[data-zero] { opacity: .5; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); opacity: 1; }
.chip[aria-pressed="true"] b { color: var(--surface); }
.search { margin-left: auto; }
.search input { height: 30px; width: 240px; padding: 0 10px; border: 1px solid var(--border); border-radius: 7px;

.updated { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 12ch; text-align: right; }
.banner { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 16px; font-size: 13px;

.banner[hidden] { display: none; }
.btn { height: 28px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
.btn:hover { background: var(--hover); }
.link { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; cursor: pointer; }
main { max-width: 1320px; margin: 0 auto; padding: 20px 24px 48px; transition: opacity .2s; }
main.dim { opacity: .55; }

/* status */
.ic { width: 12px; height: 12px; flex: none; fill: currentColor; }
.ic-ok { color: var(--good); }
.ic-warn { color: var(--warning); stroke: var(--warning-edge); stroke-width: .9; }
.ic-crit { color: var(--serious); }
.ic-down { color: var(--critical); }
.ic-stale { color: var(--muted); }
.st { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; }

/* tables */
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 0 12px; height: 42px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--grid); }
tbody:last-child tr:last-child td { border-bottom: 0; }
thead th { height: 34px; font-size: 11px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
th.num { text-align: right; }
tr.grp th { height: 30px; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--ink-2); }
tr.grp span { font-weight: 400; margin-left: 4px; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--hover); }

tr.s-crit { --edge: var(--serious); }
tr.s-down { --edge: var(--critical); }
tr.s-stale td { color: var(--ink-2); }
td.name { line-height: 1.25; }

td small { display: block; font-size: 11px; color: var(--ink-2); line-height: 1.2; }
.lossy { font-weight: 650; }
.delta { font-size: 11px; color: var(--ink-2); margin-left: 6px; }
.chg { display: inline-flex; align-items: center; gap: 5px; font-weight: 550; }
.spark { display: block; }
.srcbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.srcbar .k { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
.seg button .ic { margin-right: 5px; vertical-align: -1px; }
.toolbar .srcbar { margin: 0; }
td.srcs { white-space: nowrap; }
.sv { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; font-size: 12px; color: var(--ink-2); }
.lang { height: 28px; padding: 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .04em; }

.crumbs a:hover { color: var(--ink); text-decoration: underline; }

.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
h1 { font-size: 22px; font-weight: 650; letter-spacing: -.015em; margin: 2px 0 1px; }
h2 { font-size: 14px; font-weight: 650; margin: 0; }
.dhead .st { font-size: 14px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
.dhead .st .ic { width: 14px; height: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.kpi .k { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
.kpi .v { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 650; margin-top: 4px; letter-spacing: -.01em; }
.kpi .v small { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.kpi .s { font-size: 12px; color: var(--ink-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }

.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

.hint { font-size: 12px; color: var(--ink-2); }

.legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }

.lg-sq { width: 8px; height: 12px; border-radius: 2px 2px 0 0; background: var(--c); }

#chart { display: block; width: 100%; cursor: crosshair; border-radius: 4px; }

.tip b { font-weight: 650; }
.tip dl { display: grid; grid-template-columns: auto auto; gap: 2px 16px; margin: 6px 0 0; }
.tip dt { color: var(--ink-2); }
.tip dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 550; }

.tmeta { display: flex; gap: 8px 28px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.tmeta > div { display: flex; align-items: center; gap: 8px; }

.tsum { margin-left: auto; font-weight: 550; }
.note.note-bad { display: flex; align-items: center; gap: 8px; color: var(--ink); background: color-mix(in srgb, var(--critical) 10%, transparent); }
.note { margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; }

.ipc.silent { color: var(--ink-2); }

  font-weight: 500; color: var(--ink-2); border: 1px solid var(--border); vertical-align: 1px; cursor: help; }
.tag-real { color: var(--ink); border-color: color-mix(in srgb, var(--critical) 55%, transparent);

.barw { display: inline-block; width: 52px; margin-right: 8px; vertical-align: middle; text-align: left; }
.bar { display: block; height: 4px; border-radius: 2px; background: var(--ink-2); opacity: .4; }
.dl { font-weight: 650; }
.foot { margin: 10px 0 0; font-size: 12px; color: var(--ink-2); }
details.card > summary { cursor: pointer; font-weight: 650; font-size: 14px; }
details.card[open] > summary { margin-bottom: 10px; }
details .tablewrap { max-height: 420px; overflow: auto; }

/* states */
.empty { padding: 56px 16px; text-align: center; color: var(--ink-2); }
.empty h3 { margin: 0 0 6px; font-size: 15px; color: var(--ink); }
.empty p { margin: 0 0 14px; }
.skel { height: 42px; border-bottom: 1px solid var(--grid);
  background: linear-gradient(90deg, transparent 0, var(--surface-2) 40%, transparent 80%) 0 0 / 200% 100%; animation: sh 1.4s linear infinite; }
@keyframes sh { from { background-position: 100% 0; } to { background-position: -100% 0; } }

@media (max-width: 1100px) { .chip .lbl { display: none; } }
@media (max-width: 720px) {
  .top { padding: 10px 16px; gap: 10px; }
  .search { margin-left: 0; flex: 1 1 100%; order: 3; }
  .search input { width: 100%; }
  .updated { margin-left: auto; }
  main { padding: 16px 16px 40px; }
  .col-spark, .col-jit, .col-age, .hint { display: none; }
  .tsum { margin-left: 0; }
}
</style>

    traceErr: "Não foi possível carregar o traceroute", tryAgain: "Tentar de novo", noTracesT: "Ainda sem traceroutes",
    noTracesB: "O primeiro mtr corre na próxima ronda (≤ 5 min).",
    stuck: (h, ip) => `O traceroute não chega ao destino: a última resposta vem do salto ${h} (${ip}).`,
    noPrev: "Sem traceroute anterior.", sameHops: "Mesmos saltos", dest: "destino", now: "Agora", before: "Antes",
    goLatest: "ir para o mais recente", latest: "mais recente",
    fallback: "Sem mudança de rota no histórico deste alvo: a comparar com a ronda anterior.",
    cAvg: "Média", cSd: "Desvio", cDelta: "Δ média", cHop: "Salto", cTime: "Hora", cMin: "Mín", cMax: "Máx",
    foot: "Perda só num salto intermédio = rate-limit de ICMP, não perda real. Conta a perda que começa num salto e se mantém até ao destino.",
    langBtn: "EN", langTitle: "English",
  },
};
const t = (k, ...a) => { const v = I18N[LANG][k] ?? I18N.en[k] ?? k; return typeof v === "function" ? v(...a) : v; };

// ---------- formatting ----------
const NB = " ";
const ms = v => v == null ? "—" : v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : String(Math.round(v));
const msU = v => v == null ? "—" : ms(v) + NB + "ms";
const pct = v => v == null ? "—" : (v > 0 && v < 1 ? v.toFixed(1) : Math.round(v)) + NB + "%";
const fT = new Intl.DateTimeFormat(LOC, { hour: "2-digit", minute: "2-digit" });
const fD = new Intl.DateTimeFormat(LOC, { day: "2-digit", month: "2-digit" });
const fDT = new Intl.DateTimeFormat(LOC, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const at = (ts, f = fDT) => f.format(new Date(ts * 1000));
const ago = s => s < 90 ? t("ago", Math.max(0, Math.round(s)), "s") : s < 5400 ? t("ago", Math.round(s / 60), "min")
  : s < 129600 ? t("ago", Math.round(s / 3600), "h") : t("ago", Math.round(s / 86400), "d");

// ---------- status: shape + label, never colour alone ----------
const SHAPE = {
  ok: '<circle cx="6" cy="6" r="4.6"/>',
  warn: '<path d="M6 1.3 11.2 10.6H.8z"/>',
  crit: '<path d="M6 .7 11.3 6 6 11.3.7 6z"/>',
  down: '<path d="M2.4 1 6 4.6 9.6 1 11 2.4 7.4 6 11 9.6 9.6 11 6 7.4 2.4 11 1 9.6 4.6 6 1 2.4z"/>',
  stale: '<circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/>',
};
const SEV = { down: 4, crit: 3, warn: 2, stale: 1, ok: 0 };
const ORDER = ["down", "crit", "warn", "stale", "ok"];
const icon = st => `<svg class="ic ic-${st}" viewBox="0 0 12 12" aria-hidden="true">${SHAPE[st]}</svg>`;
const pill = st => `<span class="st">${icon(st)}${t(st)}</span>`;
const SWAP = '<svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 3.5h8.2L7.4 1.7l.9-.9L11.6 4 8.3 7.2l-.9-.9 1.8-1.8H1zm10 5H2.8l1.8 1.8-.9.9L.4 8l3.3-3.2.9.9-1.8 1.8H11z"/></svg>';

const routeVar = i => i < 3 ? `--route-${i + 1}` : "--route-x";
const rb = (labelTxt, i) => `<span class="rb" style="--c:var(${routeVar(i)})" title="${t("route")} ${esc(labelTxt)}">${esc(labelTxt)}</span>`;

// ---------- state ----------
const RANGES = [[10800, "3 h"], [86400, "24 h"], [604800, "7 d"], [2592000, "30 d"]];
const S = {
  ov: null, ovAt: 0, offline: false, filter: null, q: "",
  id: null, det: null, detErr: null, range: +store.get("range", 86400) || 86400,
  sel: null, vs: "route", trace: null, hover: null, geo: null, src: store.get("src", "") || "",
};
const srcQ = () => S.src ? `&src=${encodeURIComponent(S.src)}` : "";

async function api(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) { const e = new Error(`HTTP ${r.status}`); e.status = r.status; throw e; }
  return r.json();
}

function setOffline(on) {
  S.offline = on;
  $("#banner").hidden = !on;
  $("#view").classList.toggle("dim", on && !!(S.ov || S.det));
}

async function refresh() {
  try {
    let ov;
    try { ov = await api(`/api/overview?${srcQ().slice(1)}`); }
    catch (e) { if (e.status !== 400 || !S.src) throw e; S.src = ""; ov = await api("/api/overview"); }   // that source is gone
    S.ov = ov; S.src = ov.source;
    S.ovAt = Date.now();
    setOffline(false);
  } catch { setOffline(true); }
  renderChips(); tick();
  if (S.id) await loadDetail(); else renderOverview();
}

function tick() {
  $("#updated").textContent = S.ovAt ? t("updated", ago((Date.now() - S.ovAt) / 1000)) : "";
}

// ---------- header ----------
function renderChips() {
  const n = { ok: 0, warn: 0, crit: 0, down: 0, stale: 0 };
  for (const t of S.ov?.targets || []) n[t.status]++;
  $("#chips").innerHTML = ORDER.map(st =>
    `<button class="chip" data-st="${st}" aria-pressed="${S.filter === st}" ${n[st] ? "" : "data-zero"}
      title="${t("showOnly", t(st))}" aria-label="${n[st]} ${t(st)}">${icon(st)}<b>${n[st]}</b><span class="lbl">${t(st)}</span></button>`).join("");
  const bad = n.down + n.crit;
  const worst = ORDER.find(st => n[st] && st !== "stale") || "ok";
  const col = { down: "#d03b3b", crit: "#ec835a", warn: "#fab219", ok: "#0ca30c" }[worst];
  $("#fav").href = `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="${col}"/></svg>`)}`;
  document.title = (bad ? `(${bad}) ` : "") + (S.det ? `${S.det.target.name} · smoketrace` : "smoketrace");
}

// ---------- sources (where the probes run) ----------
function srcSeg() {
  const srcs = S.ov?.sources || [];
  if (srcs.length < 2) return "";
  return `<div class="srcbar"><span class="k">${t("cSeen")}</span><div class="seg sm" role="group" aria-label="${t("srcAria")}">${srcs.map(s => {
    const late = !s.last_ts || S.ov.now - s.last_ts > 3 * S.ov.step;
    return `<button data-src="${esc(s.name)}" aria-pressed="${s.name === S.src}">${late ? icon("stale") : ""}${esc(s.name)}</button>`;
  }).join("")}</div></div>`;
}

// ---------- overview ----------
function empty(title, body) { return `<div class="empty"><h3>${title}</h3><p>${body}</p></div>`; }

function renderOverview() {
  const v = $("#view");
  v.dataset.view = "ov";
  if (!S.ov) {
    v.innerHTML = S.offline ? empty(t("noConnT"), t("noConnB"))
      : `<div class="tablewrap" aria-busy="true">${'<div class="skel"></div>'.repeat(6)}</div>`;
    return;
  }
  const all = S.ov.targets;
  if (!all.length) { v.innerHTML = empty(t("noTargetsT"), t("noTargetsB")); return; }
  const q = S.q.trim().toLowerCase();
  const rows = all.filter(t => (!S.filter || t.status === S.filter) && (!q || `${t.name} ${t.host} ${t.group}`.toLowerCase().includes(q)));
  if (!rows.length) {
    v.innerHTML = empty(t("noMatch"), `<button class="btn" data-act="clear">${t("clear")}</button>`);
    return;
  }
  const groups = new Map();
  for (const t of rows) { if (!groups.has(t.group)) groups.set(t.group, []); groups.get(t.group).push(t); }
  const multi = S.ov.sources.length > 1, cols = multi ? 9 : 8;
  let h = `${srcSeg()}<div class="tablewrap"><table class="targets"><thead><tr>
    <th scope="col">${t("cStatus")}</th><th scope="col">${t("cTarget")}</th><th scope="col" class="num">${t("cMedian")}</th>
    <th scope="col" class="num col-jit">Jitter</th><th scope="col" class="num">${t("cLoss")}</th>
    <th scope="col" class="col-spark">${t("cSpark")}</th><th scope="col">${t("cRoute")}</th>
    ${multi ? `<th scope="col">${t("cSeen")}</th>` : ""}<th scope="col" class="num col-age">${t("cRound")}</th>
  </tr></thead>`;
  for (const [g, ts] of groups) {
    ts.sort((a, b) => SEV[b.status] - SEV[a.status] || a.name.localeCompare(b.name, LOC));
    h += `<tbody><tr class="grp"><th colspan="${cols}" scope="rowgroup">${esc(g)}<span>${ts.length}</span></th></tr>${ts.map(rowHtml).join("")}</tbody>`;
  }
  v.innerHTML = h + "</table></div>";
}

function rowHtml(tg) {
  const now = S.ov.now;
  const d = tg.median != null && tg.baseline ? tg.median - tg.baseline : 0;
  const delta = d >= Math.max(2, tg.baseline * 0.2) ? `<span class="delta" title="${esc(t("aboveBase", msU(tg.baseline)))}">▲${NB}+${ms(d)}</span>` : "";
  const route = tg.route_changes
    ? `<span class="chg">${SWAP}${t("changes", tg.route_changes)}</span><small>${t("lastAgo", ago(now - tg.last_change))}</small>`
    : `<span class="muted">${t("stable")}</span>`;
  const seen = !tg.by_source ? "" : `<td class="srcs">${Object.entries(tg.by_source).map(([s, st]) =>
    `<span class="sv" title="${esc(s)}: ${t(st)}">${icon(st)}${esc(s)}</span>`).join("")}</td>`;
  return `<tr class="row s-${tg.status}" data-id="${esc(tg.id)}">
    <td>${pill(tg.status)}</td>
    <td class="name"><a href="#/t/${esc(tg.id)}">${esc(tg.name)}</a><span class="mono">${esc(tg.host)}</span></td>
    <td class="num">${msU(tg.median)}${delta}</td>
    <td class="num col-jit">${msU(tg.jitter)}</td>
    <td class="num${tg.loss > 0 ? " lossy" : ""}">${pct(tg.loss)}</td>
    <td class="col-spark">${spark(tg, now)}</td>
    <td>${route}</td>${seen}
    <td class="num col-age">${tg.last_ts ? ago(now - tg.last_ts) : "—"}</td>
  </tr>`;
}

function spark(tg, now) {
  const W = 156, H = 30, pts = tg.spark;
  const meds = pts.map(p => p[1]).filter(v => v != null);
  if (!pts.length) return '<span class="muted">—</span>';
  const ymax = Math.max(...meds, 0.1) * 1.15, from = now - 86400;
  const X = ts => ((ts - from) / 86400 * W).toFixed(1), Y = v => (H - 6 - v / ymax * (H - 8)).toFixed(1);
  let d = "", pen = false, loss = "", maxLoss = 0;
  for (const [ts, m, l] of pts) {
    if (m == null) pen = false; else { d += `${pen ? "L" : "M"}${X(ts)} ${Y(m)}`; pen = true; }
    if (l > 0) {
      maxLoss = Math.max(maxLoss, l);
      loss += `<rect x="${X(ts)}" y="${H - 1 - (1 + l / 100 * 5)}" width="1.6" height="${1 + l / 100 * 5}" fill="var(${l >= 20 ? "--critical" : "--warning"})"/>`;
    }
  }
  const lbl = meds.length ? t("sparkLbl", msU(Math.min(...meds)), msU(Math.max(...meds)), pct(maxLoss)) : t("sparkNone");
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${lbl}"><title>${lbl}</title>
    <path d="${d}" fill="none" stroke="var(--ink-2)" stroke-width="1.4" stroke-linejoin="round"/>${loss}</svg>`;
}

// ---------- detail ----------
async function openTarget(id) {
  if (S.id !== id) Object.assign(S, { id, det: null, detErr: null, trace: null, sel: null, hover: null });
  renderDetail();
  await loadDetail();
}

async function loadDetail() {
  const id = S.id;
  try {
    const d = await api(`/api/target?id=${encodeURIComponent(id)}&range=${S.range}${srcQ()}`);
    if (S.id !== id) return;
    S.det = d; S.detErr = null;
  } catch (e) {
    if (S.id !== id) return;
    S.detErr = e.status === 404 ? "notfound" : "offline";
    if (S.detErr === "offline") setOffline(true);
  }
  renderDetail();
  if (S.det && (S.sel == null || !S.trace)) loadTrace();   // following "latest": refresh the trace too
}

async function loadTrace() {
  const id = S.id;
  try {
    const tr = await api(`/api/trace?id=${encodeURIComponent(id)}&vs=${S.vs}${S.sel ? `&ts=${S.sel}` : ""}${srcQ()}`);
    if (S.id === id) S.trace = tr;
  } catch { if (S.id === id) S.trace = { error: true }; }
  renderTrace(); drawChart();
}

function renderDetail() {
  const v = $("#view");
  if (S.detErr === "notfound") {
    v.dataset.view = "nf";
    v.innerHTML = empty(t("notFoundT"), t("notFoundB"));
    return;
  }
  if (v.dataset.view !== "t:" + S.id) {
    v.dataset.view = "t:" + S.id;
    v.innerHTML = `
      <nav class="crumbs"><a href="#/">${t("allTargets")}</a></nav>
      <section class="dhead" id="dhead"></section>
      <section class="kpis" id="kpis"></section>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="${t("rangeAria")}">${RANGES.map(([s, l]) => `<button data-range="${s}">${l}</button>`).join("")}</div>
        <span id="srcd"></span>
        <span class="hint">${t("hint")}</span>
      </div>
      <section class="card">
        <div class="card-h"><h2>${t("chartTitle")}</h2><div class="legend" id="legend"></div></div>
        <div class="chart-wrap"><canvas id="chart" tabindex="0" role="img" aria-label="${t("chartAria")}"></canvas><div class="tip" id="tip" hidden></div></div>
      </section>
      <section class="card" id="trace" aria-live="polite"></section>
      <details class="card" id="rawd"><summary>${t("rawTitle")}</summary><div id="raw"></div></details>`;
  }
  for (const b of v.querySelectorAll("[data-range]")) b.setAttribute("aria-pressed", +b.dataset.range === S.range);
  $("#srcd").innerHTML = srcSeg();
  const d = S.det;
  if (!d) {
    $("#dhead").innerHTML = `<div><div class="eyebrow">&nbsp;</div><h1>${t("loading")}</h1></div>`;
    $("#kpis").innerHTML = "";
    renderTrace(); drawChart();
    return;
  }
  const tg = d.target, segs = d.segments, cur = segs[segs.length - 1];
  const changes = segs.filter(s => s.change).length;
  $("#dhead").innerHTML = `<div><div class="eyebrow">${esc(tg.group)}</div><h1>${esc(tg.name)}</h1><div class="mono muted">${esc(tg.host)}</div></div>${pill(tg.status)}`;
  const rangeLbl = RANGES.find(r => r[0] === S.range)?.[1] || "";
  const kpi = (k, v, s) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  $("#kpis").innerHTML =
    kpi(t("cMedian"), msU(tg.median), tg.baseline ? t("base", msU(tg.baseline)) : t("noBase")) +
    kpi("Jitter", msU(tg.jitter), t("jitterSub")) +
    kpi(t("cLoss"), pct(tg.loss), t("lossSub", d.pings)) +
    kpi(t("curRoute"), cur ? `${rb(cur.label, cur.route)}<small>${t("hops", cur.hops)}</small>` : "—",
      cur ? t("since", at(cur.from)) : t("noTrace")) +
    kpi(t("changesK", rangeLbl), String(changes), changes ? t("lastAgo", at(segs.filter(s => s.change).pop().from)) : t("stableRoute"));
  const routes = [...new Map(segs.map(s => [s.route, s])).values()].sort((a, b) => a.route - b.route);
  $("#legend").innerHTML = `<span><i class="lg-line"></i>${t("cMedian")}</span>
    <span><i class="lg-smoke"></i>${t("smoke", d.pings)}</span>
    <span><i class="lg-sq" style="--c:var(--warning)"></i>${esc(t("lossLt", d.loss_crit + NB + "%"))}</span>
    <span><i class="lg-sq" style="--c:var(--critical)"></i>≥ ${d.loss_crit}${NB}%</span>
    ${routes.length ? `<span>${t("routes")} ${routes.map(s => rb(s.label, s.route)).join(" ")}</span>` : ""}`;
  renderChips(); drawChart(); renderTrace();
  if ($("#rawd").open) renderRaw();
}

// ---------- chart (canvas) ----------
const L = { l: 54, r: 14, t: 12, ph: 220, g1: 14, lh: 34, g2: 10, rh: 22, ax: 24 };

function niceTicks(max) {
  const raw = max / 4, p = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw);
  const out = [];
  for (let v = 0; v < max + step * 0.999; v += step) out.push(+v.toFixed(6));
  return out;
}
const fmtTick = v => v >= 10 ? String(Math.round(v)) : String(+v.toFixed(2));

function segAt(ts) {
  const segs = S.det?.segments || [];
  for (let i = segs.length - 1; i >= 0; i--) if (segs[i].from <= ts) return segs[i];
  return null;
}

function drawChart() {
  const cv = $("#chart"), d = S.det;
  if (!cv) return;
  const W = cv.parentElement.clientWidth, H = L.t + L.ph + L.g1 + L.lh + L.g2 + L.rh + L.ax;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + "px";
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const C = Object.fromEntries(["--ink", "--ink-2", "--muted", "--grid", "--axis", "--surface", "--smoke", "--warning", "--critical"].map(n => [n, cssv(n)]));
  const FONT = "11px system-ui, -apple-system, 'Segoe UI', sans-serif";
  g.font = FONT; g.textBaseline = "middle";
  const x0 = L.l, x1 = W - L.r, pw = x1 - x0;
  const yTop = L.t, yBot = L.t + L.ph, ly0 = yBot + L.g1, ly1 = ly0 + L.lh, ry0 = ly1 + L.g2, ry1 = ry0 + L.rh;
  const line = (a, b, c, e) => { g.beginPath(); g.moveTo(a, b); g.lineTo(c, e); g.stroke(); };
  if (!d || !d.points.length) {
    g.fillStyle = C["--ink-2"]; g.textAlign = "center"; g.font = "13px system-ui, sans-serif";
    g.fillText(d ? t("waiting") : t("loading"), W / 2, H / 2);
    S.geo = null; cv.setAttribute("aria-label", t("noData")); return;
  }
  const { from, to, points: pts } = d;
  const X = ts => x0 + (ts - from) / (to - from) * pw;
  const bw = Math.max(1, d.bucket / (to - from) * pw);
  const tops = pts.map(p => p[4].length ? p[4][p[4].length - 1] : p[1]).filter(v => v != null).sort((a, b) => a - b);
  const meds = pts.map(p => p[1]).filter(v => v != null);
  const p95 = tops.length ? tops[Math.floor((tops.length - 1) * 0.95)] : 1;   // one spike must not flatten the rest
  const ticks = niceTicks(Math.max(p95 * 1.1, Math.max(0, ...meds) * 1.12, 1));
  const ymax = ticks[ticks.length - 1];
  const Y = v => yBot - Math.min(v, ymax) / ymax * L.ph;

  // grid + y axis
  g.textAlign = "right"; g.lineWidth = 1;
  for (const tv of ticks) {
    const y = Math.round(Y(tv)) + 0.5;
    g.strokeStyle = tv === 0 ? C["--axis"] : C["--grid"]; line(x0, y, x1, y);
    g.fillStyle = C["--muted"]; g.fillText(tv === ymax ? `${fmtTick(tv)} ms` : fmtTick(tv), x0 - 8, y);
  }
  g.fillStyle = C["--muted"];
  g.fillText(t("lossAxis"), x0 - 8, ly0 + L.lh / 2); g.fillText(t("routeAxis"), x0 - 8, ry0 + L.rh / 2);
  g.strokeStyle = C["--grid"]; line(x0, ly0 + 0.5, x1, ly0 + 0.5);
  g.strokeStyle = C["--axis"]; line(x0, ly1 + 0.5, x1, ly1 + 0.5);

  // smoke: nested min..max bands of the sorted pings, darker towards the median (SmokePing style)
  g.fillStyle = `rgba(${C["--smoke"]},.11)`;
  for (const p of pts) {
    const s = p[4], n = s.length, x = X(p[0]);
    for (let k = 0; k < n >> 1; k++) { const yh = Y(s[n - 1 - k]); g.fillRect(x, yh, bw, Math.max(1, Y(s[k]) - yh)); }
  }

  // route-change rules, in the colour of the new route, across all three bands
  g.lineWidth = 1.5;
  for (const s of d.segments) if (s.change) { const x = Math.round(X(s.from)) + 0.5; g.strokeStyle = cssv(routeVar(s.route)); line(x, yTop, x, ry1); }

  // median
  g.strokeStyle = C["--ink"]; g.lineWidth = 1.75; g.lineJoin = "round"; g.beginPath();
  let pen = false, last = null;
  for (const p of pts) {
    if (p[1] == null || (last != null && p[0] - last > d.bucket * 1.5)) pen = false;
    if (p[1] == null) continue;
    const x = X(p[0]) + bw / 2, y = Y(p[1]);
    pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true; last = p[0];
  }
  g.stroke();

  // loss strip: height = loss, colour = severity
  for (const p of pts) if (p[2] > 0) {
    const h = Math.max(2, p[2] / 100 * L.lh);
    g.fillStyle = p[2] >= d.loss_crit ? C["--critical"] : C["--warning"];
    g.fillRect(X(p[0]), ly1 - h, Math.max(1, bw > 3 ? bw - 1 : bw), h);
  }

  // route strip: tinted segment + solid top edge + letter (identity never by colour alone)
  g.textAlign = "center";
  for (const s of d.segments) {
    const a = Math.max(X(s.from), x0), b = Math.min(X(s.end), x1), w = b - a - (b < x1 ? 2 : 0);
    if (w <= 0) continue;
    const col = cssv(routeVar(s.route));
    g.fillStyle = col; g.globalAlpha = 0.24; g.fillRect(a, ry0, w, L.rh); g.globalAlpha = 1; g.fillRect(a, ry0, w, 2);
    if (w >= 16) { g.fillStyle = C["--ink"]; g.font = "600 11px system-ui, sans-serif"; g.fillText(s.label, a + w / 2, ry0 + L.rh / 2 + 1); g.font = FONT; }
  }

  // x axis, local-time aligned
  const span = to - from, steps = [300, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400, 172800, 604800];
  const step = steps.find(s => span / s <= pw / 84) || 604800;
  const off = new Date().getTimezoneOffset() * 60;
  g.fillStyle = C["--muted"]; g.strokeStyle = C["--axis"]; g.lineWidth = 1;
  for (let tt = Math.ceil((from - off) / step) * step + off; tt <= to; tt += step) {
    const x = Math.round(X(tt)) + 0.5, dt = new Date(tt * 1000);
    line(x, ry1 + 2, x, ry1 + 6);
    const midnight = dt.getHours() === 0 && dt.getMinutes() === 0;
    g.fillText(step >= 86400 || midnight ? fD.format(dt) : fT.format(dt), x, ry1 + 15);
  }

  // selected trace + hover crosshair
  const sel = S.trace?.cur?.ts;
  if (sel != null && sel >= from) {
    const x = Math.round(X(sel) + bw / 2) + 0.5;
    g.strokeStyle = C["--ink"]; g.lineWidth = 1.5; line(x, yTop, x, ly1);   // stops above the route letters
    g.fillStyle = C["--ink"]; g.beginPath(); g.moveTo(x - 5, yTop - 6); g.lineTo(x + 5, yTop - 6); g.lineTo(x, yTop); g.fill();
  }
  const hp = S.hover != null ? pts[S.hover] : null;
  if (hp) {
    const x = Math.round(X(hp[0]) + bw / 2) + 0.5;
    g.strokeStyle = C["--muted"]; g.lineWidth = 1; line(x, yTop, x, ly1);
    if (hp[1] != null) {
      g.beginPath(); g.arc(x, Y(hp[1]), 4, 0, 2 * Math.PI);
      g.fillStyle = C["--ink"]; g.fill(); g.lineWidth = 2; g.strokeStyle = C["--surface"]; g.stroke();
    }
  }
  S.geo = { x0, x1, X, bw, W };
  cv.setAttribute("aria-label", t("chartLbl", d.target.name, msU(Math.min(...meds)), msU(Math.max(...meds)), t("changes", d.segments.filter(s => s.change).length)));
}

function nearest(x) {
  const pts = S.det.points, gm = S.geo;
  let lo = 0, hi = pts.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; gm.X(pts[m][0]) + gm.bw / 2 < x ? lo = m + 1 : hi = m; }
  if (lo > 0 && Math.abs(gm.X(pts[lo - 1][0]) - x) < Math.abs(gm.X(pts[lo][0]) - x)) lo--;
  return lo;
}

function showTip(i) {
  const tip = $("#tip"), p = S.det?.points[i];
  if (!p || !S.geo) { tip.hidden = true; return; }
  const seg = segAt(p[0]), s = p[4];
  const bucketed = S.det.bucket > 300;
  tip.innerHTML = `<b>${at(p[0])}</b>${bucketed ? ` <span class="muted">· ${Math.round(S.det.bucket / 60)} min</span>` : ""}
    <dl><dt>${t("cMedian")}</dt><dd>${msU(p[1])}</dd>
    <dt>${t("minMax")}</dt><dd>${s.length ? `${ms(s[0])} – ${ms(s[s.length - 1])}${NB}ms` : "—"}</dd>
    <dt>${t("cLoss")}</dt><dd>${pct(p[2])}</dd><dt>Jitter</dt><dd>${msU(p[3])}</dd>
    <dt>${t("route")}</dt><dd>${seg ? rb(seg.label, seg.route) : "—"}</dd></dl>
    <div class="tip-f">${t("clickTrace")}</div>`;
  tip.hidden = false;
  const x = S.geo.X(p[0]) + S.geo.bw / 2, w = tip.offsetWidth;
  tip.style.left = `${x + 14 + w > S.geo.W ? Math.max(0, x - 14 - w) : x + 14}px`;
  tip.style.top = `${L.t + 4}px`;
}

function setHover(i) {
  if (S.hover === i) return;
  S.hover = i; drawChart();
  i == null ? ($("#tip").hidden = true) : showTip(i);
}

function selectPoint(i) {
  const p = S.det?.points[i];
  if (!p) return;
  const lastTs = S.det.points[S.det.points.length - 1][0];
  S.sel = p[0] >= lastTs ? null : p[0] + S.det.bucket - 1;   // inside a bucket: its last trace
  loadTrace();
}

// ---------- traceroute diff ----------
const STATE = {
  same: [`<span class="badge same">${t("same")}</span>`],
  changed: [`<span class="badge">${SWAP}${t("changed")}</span>`],
  added: [`<span class="badge">${t("added")}</span>`],
  removed: [`<span class="badge">${t("removed")}</span>`],
  unknown: [`<span class="badge same">${t("unknown")}</span>`],
};

function ipCell(h) {
  if (!h) return '<span class="muted">—</span>';
  return h.ip ? `<span class="ipc mono">${esc(h.ip)}</span>` : `<span class="ipc mono silent" title="${t("silentTip")}">???</span>`;
}

function lossCell(h, origin) {
  if (!h || !h.ip) return '<span class="muted">—</span>';
  if (h.loss <= 0) return '<span class="muted">0' + NB + "%</span>";
  const real = origin != null && h.ttl >= origin;
  const tag = real ? (h.ttl === origin ? `<span class="tag tag-real" title="${t("realTip")}">${icon("down")}${t("realStarts")}</span>` : "")
    : `<span class="tag" title="${t("rlTip")}">rate-limit</span>`;
  return `<span class="${real ? "dl" : ""}">${pct(h.loss)}</span>${tag}`;
}

function renderTrace() {
  const el = $("#trace");
  if (!el) return;
  const tr = S.trace;
  const head = `<div class="card-h"><h2>Traceroute (mtr)</h2>
    <div class="seg sm" role="group" aria-label="${t("compareAria")}">
      <button data-vs="route" aria-pressed="${S.vs === "route"}">${t("vsRoute")}</button>
      <button data-vs="round" aria-pressed="${S.vs === "round"}">${t("vsRound")}</button></div></div>`;
  if (!tr) { el.innerHTML = head + `<div class="empty">${t("loading")}</div>`; return; }
  if (tr.error) { el.innerHTML = head + empty(t("traceErr"), `<button class="btn" data-act="retrace">${t("tryAgain")}</button>`); return; }
  if (!tr.cur) { el.innerHTML = head + empty(t("noTracesT"), t("noTracesB")); return; }
  const { cur, prev, rows } = tr;
  const n = st => rows.filter(r => r.state === st).length;
  const nc = n("changed"), na = n("added"), nr = n("removed"), nu = n("unknown");
  const lastOf = hops => [...hops].reverse().find(h => h.ip && h.avg != null);
  const dc = lastOf(cur.hops), dp = prev && lastOf(prev.hops);
  const dDest = dc && dp && dc.ip === dp.ip ? dc.avg - dp.avg : null;   // only when both reached the same last hop
  const tail = cur.hops[cur.hops.length - 1];
  const stuck = tail && !tail.ip && dc ? t("stuck", dc.ttl, esc(dc.ip)) : "";
  const parts = [nc && t("hopsChanged", nc), na && t("nNew", na), nr && t("nGone", nr), nu && t("nSilent", nu)].filter(Boolean);
  const sum = !prev ? t("noPrev")
    : (parts.length ? parts.join(" · ") : t("sameHops"))
      + (dDest != null ? ` · ${t("dest")} ${dDest >= 0 ? "+" : "−"}${ms(Math.abs(dDest))}${NB}ms` : "");
  const maxAvg = Math.max(1, ...cur.hops.map(h => h.avg || 0));
  const prevAvg = new Map((prev?.hops || []).map(h => [h.ttl, h.avg]));
  const body = rows.map(r => {
    const c = r.cur, p = r.prev;
    const dv = c?.avg != null && p?.avg != null ? c.avg - p.avg : null;
    const dTxt = dv == null ? "—" : `${dv >= 0 ? "+" : "−"}${ms(Math.abs(dv))}`;
    return `<tr class="r-${r.state || "none"}">
      <td class="num">${r.ttl}</td>
      ${prev ? `<td>${ipCell(p)}${p?.avg != null ? ` <span class="muted">${msU(prevAvg.get(r.ttl))}</span>` : ""}</td>` : ""}
      <td>${ipCell(c)}</td>
      <td class="num">${lossCell(c, cur.origin)}</td>
      <td class="num">${c?.avg != null ? `<span class="barw"><span class="bar" style="width:${Math.max(2, c.avg / maxAvg * 100)}%"></span></span>${msU(c.avg)}` : '<span class="muted">—</span>'}</td>
      <td class="num">${c?.sd != null ? ms(c.sd) : "—"}</td>
      ${prev ? `<td class="num${dv != null && Math.abs(dv) >= 10 ? " dl" : ""}">${dTxt}</td><td>${STATE[r.state]?.[0] || ""}</td>` : ""}
    </tr>`;
  }).join("");
  el.innerHTML = head + `
    <div class="tmeta">
      <div><span class="k">${t("now")}</span>${rb(cur.label, cur.route)}<b>${at(cur.ts)}</b>
        ${S.sel ? `<button class="link" data-act="latest">${t("goLatest")}</button>` : `<span class="muted">${t("latest")}</span>`}</div>
      <div><span class="k">${t("before")}</span>${prev ? `${rb(prev.label, prev.route)}<span>${at(prev.ts)}</span>` : '<span class="muted">—</span>'}</div>
      <div class="tsum">${sum}</div>
    </div>
    ${stuck ? `<p class="note note-bad">${icon("down")} ${stuck}</p>` : ""}
    ${tr.fallback ? `<p class="note">${t("fallback")}</p>` : ""}
    <div class="tablewrap"><table class="hops"><thead><tr>
      <th scope="col" class="num">#</th>${prev ? `<th scope="col">${t("before")}</th>` : ""}<th scope="col">${t("now")}</th>
      <th scope="col" class="num">${t("cLoss")}</th><th scope="col" class="num">${t("cAvg")}</th><th scope="col" class="num">${t("cSd")}</th>
      ${prev ? `<th scope="col" class="num">${t("cDelta")}</th><th scope="col">${t("cHop")}</th>` : ""}
    </tr></thead><tbody>${body}</tbody></table></div>
    <p class="foot">${t("foot")}</p>`;
}

function renderRaw() {
  const d = S.det;
  if (!d) return;
  const rows = [...d.points].reverse().map(p => {
    const s = p[4], seg = segAt(p[0]);
    return `<tr><td>${at(p[0])}</td><td class="num">${msU(p[1])}</td><td class="num">${s.length ? msU(s[0]) : "—"}</td>
      <td class="num">${s.length ? msU(s[s.length - 1]) : "—"}</td><td class="num">${pct(p[2])}</td><td class="num">${msU(p[3])}</td>
      <td>${seg ? esc(seg.label) : "—"}</td></tr>`;
  }).join("");
  $("#raw").innerHTML = `<div class="tablewrap"><table><thead><tr><th scope="col">${t("cTime")}</th><th scope="col" class="num">${t("cMedian")}</th>
    <th scope="col" class="num">${t("cMin")}</th><th scope="col" class="num">${t("cMax")}</th><th scope="col" class="num">${t("cLoss")}</th>
    <th scope="col" class="num">Jitter</th><th scope="col">${t("route")}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---------- events ----------
function route() {
  const m = location.hash.match(/^#\/t\/([\w-]+)$/);
  if (m) return openTarget(m[1]);
  Object.assign(S, { id: null, det: null, detErr: null, trace: null, sel: null, hover: null });
  renderChips(); renderOverview();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-st],[data-range],[data-vs],[data-src],[data-act],tr.row");
  if (!b) return;
  const ds = b.dataset;
  if (ds.st) {
    S.filter = S.filter === ds.st ? null : ds.st;
    renderChips();
    if (S.id) location.hash = "#/"; else renderOverview();
  } else if (ds.range) {
    S.range = +ds.range; store.set("range", S.range); S.hover = null; $("#tip").hidden = true; loadDetail();
  } else if (ds.vs) { S.vs = ds.vs; loadTrace(); }
  else if (ds.src) { S.src = ds.src; store.set("src", S.src); S.trace = null; S.sel = null; S.hover = null; refresh(); }
  else if (ds.act === "lang") { store.set("lang", LANG === "pt" ? "en" : "pt"); location.reload(); }
  else if (ds.act === "latest") { S.sel = null; loadTrace(); }
  else if (ds.act === "retrace") loadTrace();
  else if (ds.act === "retry") refresh();
  else if (ds.act === "clear") { S.filter = null; S.q = ""; $("#q").value = ""; renderChips(); renderOverview(); }
  else if (b.matches("tr.row") && !e.target.closest("a")) location.hash = "#/t/" + ds.id;
});

const view = $("#view");
const pointAt = e => {
  if (e.target.id !== "chart" || !S.geo || !S.det?.points.length) return undefined;
  const x = e.clientX - e.target.getBoundingClientRect().left;
  return x < S.geo.x0 - 4 || x > S.geo.x1 + 4 ? null : nearest(x);
};
view.addEventListener("pointermove", e => { const i = pointAt(e); if (i !== undefined) setHover(i); });
view.addEventListener("pointerout", e => { if (e.target.id === "chart") setHover(null); });
view.addEventListener("click", e => { const i = pointAt(e); if (i != null) selectPoint(i); });
view.addEventListener("focusout", e => { if (e.target.id === "chart") setHover(null); });
view.addEventListener("keydown", e => {
  if (e.target.id !== "chart" || !S.det?.points.length) return;
  const n = S.det.points.length, cur = S.hover ?? n - 1;
  const step = e.shiftKey ? 12 : 1;
  if (e.key === "ArrowLeft") setHover(Math.max(0, cur - step));
  else if (e.key === "ArrowRight") setHover(Math.min(n - 1, cur + step));
  else if (e.key === "Home") setHover(0);
  else if (e.key === "End") setHover(n - 1);
  else if (e.key === "Enter" || e.key === " ") selectPoint(cur);
  else return;
  e.preventDefault();
});
view.addEventListener("toggle", e => { if (e.target.id === "rawd" && e.target.open) renderRaw(); }, true);

$("#q").addEventListener("input", e => {
  S.q = e.target.value;
  if (S.id) location.hash = "#/"; else renderOverview();
});
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); $("#q").focus(); }
  else if (e.key === "Escape" && typing) { $("#q").blur(); }
  else if (e.key === "Escape" && S.id) location.hash = "#/";
});
window.addEventListener("hashchange", route);
new ResizeObserver(() => drawChart()).observe(view);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { drawChart(); if (S.ov && !S.id) renderOverview(); });

$("#chips").setAttribute("aria-label", t("filterAria"));
$("#q").placeholder = t("search");
$("#banner span").textContent = t("offline");
$("#banner button").textContent = t("retry");
$("#lang").textContent = t("langBtn");
$("#lang").title = t("langTitle");
route();
refresh();
setInterval(refresh, 60000);
setInterval(tick, 5000);
</script>
</body>
</html>
