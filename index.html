<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script>try { document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); } catch {}</script>
<style>
@font-face { font-family: "Archivo"; src: url(/fonts/archivo.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
@font-face { font-family: "Plex Mono"; src: url(/fonts/plex-mono-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Plex Mono"; src: url(/fonts/plex-mono-500.woff2) format("woff2"); font-weight: 500 700; font-display: swap; }

/* warm greys, one cool colour for data, and the status colours only where something is wrong */
:root, [data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --panel: #171716; --panel-2: #1c1b1a; --panel-3: #262523; --hover: rgba(235, 233, 228, .045);
  --line: #272624; --line-2: #3a3834;
  --ink: #ebe9e4; --ink-2: #aaa79f; --ink-3: #8f8c84;
  --brand: #ff6a33; --accent: #6eb0cf; --accent-soft: rgba(110, 176, 207, .09); --on-bad: #111110;
  --ok: #7fbf6a; --warn: #e2b341; --crit: #f08a3c; --down: #f0524a; --stale: #6b6860;
  --cell-ok: #2c2b28; --cell-none: #3a3834; --lat-0: #2c2b28; --sel: rgba(110, 176, 207, .3); --lat-1: #e2b341; --lat-2: #f0524a;
  --route-1: #6eb0cf; --route-2: #b69ae0; --route-3: #5fbf9f; --route-x: #8f8c84;
  --src-2: #e48fb4; --src-3: #d8c06a;
  --smoke: 235, 233, 228; --grid: #222120; --axis: #3a3834; --shadow: 0 6px 20px rgba(0, 0, 0, .35);
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f0eb; --panel: #faf9f6; --panel-2: #ebe8e1; --panel-3: #e0dcd2; --hover: rgba(23, 23, 23, .04);
  --line: #dedad1; --line-2: #c7c2b6;
  --ink: #171717; --ink-2: #4f4d48; --ink-3: #6b6860;
  --brand: #c2410c; --accent: #2c6b8a; --accent-soft: rgba(44, 107, 138, .08); --on-bad: #ffffff;
  --ok: #3b7a39; --warn: #a66f00; --crit: #cc5f0c; --down: #c0301c; --stale: #a9a499;
  --cell-ok: #dbd7cd; --cell-none: #b9b4a8; --lat-0: #dbd7cd; --sel: rgba(44, 107, 138, .22); --lat-1: #d9a21b; --lat-2: #c0301c;
  --route-1: #2c6b8a; --route-2: #6d4bb0; --route-3: #1d7a5f; --route-x: #8a867d;
  --src-2: #b0436f; --src-3: #8a7210;
  --smoke: 23, 23, 23; --grid: #e4e0d7; --axis: #c7c2b6; --shadow: 0 6px 20px rgba(0, 0, 0, .1);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Archivo", "Helvetica Neue", Helvetica, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
::selection { background: var(--sel); color: var(--ink); }
html { scrollbar-color: var(--line-2) transparent; }
input { caret-color: var(--brand); }
h1:focus { outline: none; }
.ar { width: 12px; height: 12px; flex: none; margin: 0 3px; vertical-align: -1px; color: var(--ink-3); }
.mono { font-family: "Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
.muted { color: var(--ink-2); }
.dim { color: var(--ink-3); }
.grow { flex: 1; }
.cap { font-size: 12.5px; color: var(--ink-2); }
.warn-t { color: var(--warn); }
[hidden] { display: none !important; }

/* ---------- shell: the sidebar and the page ---------- */
body.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; padding: 18px 12px 14px; background: var(--panel); border-right: 1px solid var(--line); }
.side-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 16px; text-decoration: none; font-weight: 650; font-size: 15px; }
.brand svg { color: var(--brand); }
.side-menu { display: none; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: transparent; border-radius: 6px; padding: 4px 10px; font-size: 12.5px; color: var(--ink-2); }
.search { position: relative; display: block; margin: 0 0 10px; }
.search input { width: 100%; height: 32px; padding: 0 30px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg); outline: none; font-size: 13px; }
.search input:focus { border-color: var(--ink-3); }
.search svg { position: absolute; left: 10px; top: 9px; color: var(--ink-3); }
.search kbd { position: absolute; right: 8px; top: 7px; font: 11px "Plex Mono", monospace; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; }
#tree { display: grid; gap: 1px; }
.side-label { margin: 16px 10px 4px; font-size: 12px; color: var(--ink-3); }
.node { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 7px; width: 100%; padding: 6px 10px 6px 6px; border: 0; border-radius: 6px;
  background: none; text-align: left; color: var(--ink-2); font-size: 13.5px; }
.node:hover { background: var(--bg); color: var(--ink); }
a.node { text-decoration: none; }
.node[aria-current="true"] { background: var(--bg); color: var(--ink); font-weight: 600; }
.node .chev { width: 14px; height: 14px; display: grid; place-items: center; color: var(--ink-3); border-radius: 3px; transition: transform .15s; }
.node .chev:hover { color: var(--ink); background: var(--panel-3); }
.node .chev.open { transform: rotate(90deg); }
.node .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .ct { display: inline-flex; align-items: center; gap: 8px; font: 400 12px "Plex Mono", monospace; color: var(--ink-3); }
.node .bad { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); }
.node .ic { width: 10px; height: 10px; }
.kids { margin-left: 12px; padding-left: 4px; border-left: 1px solid var(--line); }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
.side-foot .grow { min-height: 22px; }
.ver { font: 11.5px "Plex Mono", monospace; color: var(--ink-3); text-decoration: none; }
.ver:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.side-foot button:not(.linkish) { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line-2); background: transparent; border-radius: 4px; padding: 2px 7px; font-size: 11.5px; color: var(--ink-2); }
.side-foot button:hover { border-color: var(--ink-3); color: var(--ink); }
.linkish { border: 0; background: none; padding: 0; font-size: 12px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; }
#tree + .side-foot { margin-top: auto; }
.side > #tree { margin-bottom: 18px; }
.main { min-width: 0; width: 100%; max-width: 1600px; padding: 30px 36px 64px; }
.offline-banner { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; padding: 9px 13px; border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
  border-radius: 7px; background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--ink); font-size: 13.5px; }
.offline-banner .linkish { color: inherit; font-size: 13.5px; }

/* ---------- page head ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.page-head h1 { margin: 0; font-size: 32px; line-height: 1.08; font-weight: 500; font-stretch: 80%; letter-spacing: -.01em; overflow-wrap: anywhere; }
.lede { margin: 8px 0 0; max-width: 78ch; color: var(--ink-2); font-size: 14.5px; text-wrap: pretty; }
.lede b { color: var(--ink); font-weight: 600; }
.lede .mono { font-size: 13px; }
.iconbtn { display: inline-grid; place-items: center; width: 28px; height: 28px; border: 1px solid var(--line-2); border-radius: 6px; background: transparent; color: var(--ink-2); }
.iconbtn:hover { border-color: var(--ink-3); color: var(--ink); }
.iconbtn svg { width: 14px; height: 14px; }
.lede.mono { font-size: 13px; }
.lede .sep { margin: 0 7px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; font-size: 12.5px; color: var(--ink-3); }
.crumbs a { color: var(--ink-2); }
.head-meta { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.live { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.live.off i { background: var(--down); }

/* ---------- status: shape + label, never colour alone ---------- */
.ic { width: 12px; height: 12px; flex: none; fill: currentColor; }
.ic-ok { color: var(--ink-3); } .ic-warn { color: var(--warn); } .ic-crit { color: var(--crit); } .ic-down { color: var(--down); } .ic-stale { color: var(--stale); }
.swap { color: var(--ink-3); }
.st, .pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; color: var(--ink); }
.st.quiet { font-weight: 400; color: var(--ink-3); }

/* ---------- readouts ---------- */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
#dkpis { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.kpi { min-width: 0; padding: 18px 18px 14px; border: 0; border-left: 1px solid var(--line); background: none; text-align: left; color: inherit; font: inherit; }
.kpi:first-child { border-left: 0; padding-left: 0; }
button.kpi:hover .cap { color: var(--ink); }
button.kpi[aria-pressed="true"] { box-shadow: inset 0 -2px 0 var(--ink); }
button.kpi[aria-pressed="true"] .cap { color: var(--ink); font-weight: 600; }
.kpi .v { display: flex; align-items: baseline; gap: 4px; margin: 8px 0 3px; font-size: 32px; line-height: 1; font-weight: 450; font-stretch: 80%; letter-spacing: -.01em; white-space: nowrap; }
.kpi .v.zero { color: var(--ink-3); }
.kpi .v small { margin-left: 2px; font-size: 15px; font-stretch: 100%; font-weight: 400; color: var(--ink-3); letter-spacing: 0; }
.kpi.hot .v { color: var(--c); }
.kpi .s { min-height: 17px; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- sections ---------- */
.dash { display: grid; grid-template-columns: minmax(0, 1fr) 380px; border-bottom: 1px solid var(--line); }
.panel { min-width: 0; }
#mainp, #trace { padding: 22px 24px 26px 0; }
.rail { min-width: 0; border-left: 1px solid var(--line); padding-left: 24px; }
.rail > section { padding: 22px 0 24px; }
.rail > section + section { border-top: 1px solid var(--line); }
.sec { padding: 22px 0 18px; border-bottom: 1px solid var(--line); }
.ph { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 14px; }
.ph h2 { margin: 0; font-size: 14px; font-weight: 650; }
.count { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.hint { margin: 8px 0 0; font-size: 12px; color: var(--ink-3); }

/* tabs and filters */
.seg { display: inline-flex; flex: none; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.seg button { display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; padding: 4px 11px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.fbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--line-2); border-radius: 5px; background: transparent; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.chip b { font-weight: 500; color: var(--ink); }
.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] b { color: var(--bg); }
.chip[data-zero] { opacity: .45; }
.chip svg { opacity: .8; }
.vsep { width: 1px; height: 18px; margin: 0 4px; background: var(--line-2); }
select { padding: 3px 6px; border: 1px solid var(--line-2); border-radius: 5px; background: transparent; color: var(--ink-2); font-size: 12.5px; }
.sortl { display: inline-flex; align-items: center; gap: 6px; margin-left: 6px; }

/* heatmap */
.hmbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 10px; font-size: 12.5px; color: var(--ink-3); }
.hm-scroll { position: relative; overflow-y: auto; overflow-x: hidden; }
.hm-scroll canvas { position: sticky; top: 0; display: block; width: 100%; cursor: pointer; }
.legend { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.legend i.tick { background: linear-gradient(var(--ink) 0 3px, var(--cell-ok) 3px); }
.legend i.dash { height: 2px; border-radius: 0; background: var(--cell-none); }
.tip { position: fixed; z-index: 50; pointer-events: none; min-width: 200px; max-width: 320px; padding: 8px 10px; font-size: 12.5px; border-radius: 6px;
  background: var(--panel); border: 1px solid var(--line-2); box-shadow: var(--shadow); }
.tip b { font-weight: 650; }
.tip dl { display: grid; grid-template-columns: auto auto; gap: 2px 16px; margin: 6px 0 0; }
.tip dt { color: var(--ink-2); }
.tip dd { margin: 0; text-align: right; }
.tip .f { margin-top: 6px; color: var(--ink-3); font-size: 11.5px; }

/* table */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { height: 44px; padding: 0 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
thead th { position: sticky; top: 0; z-index: 1; height: 32px; background: var(--bg); border-bottom-color: var(--line-2); }
thead th button { all: unset; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--ink-3); }
thead th button:hover, thead th button[aria-pressed="true"] { color: var(--ink); }
th.num, td.num { text-align: right; }
tbody tr[data-open] { cursor: pointer; }
tbody tr[data-open]:hover td { background: var(--hover); }
tr.grp td { height: 40px; padding-top: 14px; vertical-align: bottom; font-weight: 600; color: var(--ink); border-bottom-color: var(--line-2); }
td .nm { font-weight: 600; }
td .sub { display: block; font: 11.5px "Plex Mono", monospace; color: var(--ink-3); }
.strip { width: 200px; height: 12px; }
.dlt { margin-left: 6px; font-size: 11.5px; color: var(--warn); }
.dots { display: inline-flex; gap: 8px; }
.dots span { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--ink-2); }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 14px 16px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; transition: border-color .15s; }
.card:hover { border-color: var(--ink-3); }
.card.bad { border-color: var(--c); }
.card .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card .nm { flex: 1; min-width: 0; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vendor { display: inline-flex; align-items: center; gap: 4px; flex: none; padding: 0 7px; border: 1px solid var(--line-2); border-radius: 4px; font-size: 11.5px; color: var(--ink-3); }
.card .grp { margin-top: -6px; font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .cmain { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.card .big { font-size: 34px; line-height: 1; font-weight: 450; font-stretch: 78%; letter-spacing: -.02em; white-space: nowrap; }
.card .big small { margin-left: 3px; font-size: 15px; font-stretch: 100%; color: var(--ink-3); letter-spacing: 0; }
.card .big.hot { color: var(--warn); }
.card .big .nv { font-size: 18px; font-stretch: 100%; font-weight: 500; color: var(--ink-2); letter-spacing: 0; }
.card dl { display: grid; gap: 1px; margin: 0; font-size: 12.5px; }
.card dl div { display: flex; justify-content: flex-end; gap: 10px; }
.card dt { color: var(--ink-3); }
.card dd { min-width: 62px; margin: 0; text-align: right; }
.card canvas { display: block; width: 100%; height: 56px; }
.card .ft { display: flex; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); overflow: hidden; white-space: nowrap; }
.card .ft > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.more { display: flex; justify-content: center; padding-top: 16px; }

/* needs attention, timeline */
.alert { display: flex; gap: 10px; margin-bottom: 14px; padding: 11px 13px; border: 1px solid var(--c); border-radius: 8px; background: color-mix(in srgb, var(--c) 8%, transparent); font-size: 13px; color: var(--ink-2); }
.alert .ic { margin-top: 3px; }
.alert b { display: block; margin-bottom: 2px; font-weight: 600; color: var(--ink); }
.alert button { all: unset; display: inline-block; margin-top: 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; color: var(--ink); }
.prob { display: block; width: 100%; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; color: inherit; }
.pb > .prob:first-of-type { border-top: 1px solid var(--line); }
.prob:hover .nm { text-decoration: underline; text-underline-offset: 3px; }
.prob .t1 { display: flex; align-items: center; gap: 8px; }
.prob .t1 .nm { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prob .t1 .when { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.prob .ln { margin-top: 2px; padding-left: 20px; font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prob .t1 .grp { margin-left: 8px; font-size: 12.5px; font-weight: 400; color: var(--ink-3); }
.prob .ln .mono { font-size: 12px; color: var(--ink); }
.clear { display: flex; align-items: flex-start; gap: 10px; color: var(--ink-2); }
.clear svg { flex: none; margin-top: 1px; color: var(--ok); }
.clear b { display: block; color: var(--ink); font-weight: 600; }
.tl { max-height: 520px; overflow: auto; }
.tl h4 { margin: 14px 0 2px; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.tl h4:first-child { margin-top: 0; }
.ev { display: grid; grid-template-columns: 44px 14px minmax(0, 1fr); align-items: center; gap: 8px; width: 100%; padding: 6px 0; border: 0; border-bottom: 1px solid var(--line);
  background: none; text-align: left; color: inherit; font-size: 13px; }
.ev.wide { grid-template-columns: 92px 14px minmax(0, 1fr); }
.ev:hover .tx b, .ev:hover .tx { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.ev .tm { font: 12px "Plex Mono", monospace; color: var(--ink-3); }
.ev .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .tx b { font-weight: 600; }
.ev .tx span { color: var(--ink-2); }
.arrow { margin: 0 4px; color: var(--ink-3); }
.rb { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 4px; font: 500 11px "Plex Mono", monospace;
  color: var(--ink); background: color-mix(in srgb, var(--c) 22%, transparent); box-shadow: inset 0 -2px 0 var(--c); }

/* ---------- target page ---------- */
.chart-wrap { position: relative; }
#chart { display: block; width: 100%; cursor: crosshair; }
.clegend { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.clegend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-line { display: inline-block; width: 16px; height: 2px; background: var(--c, var(--ink)); }
.lg-smoke { display: inline-block; width: 12px; height: 12px; border-radius: 2px; background: linear-gradient(rgba(var(--smoke), .1), rgba(var(--smoke), .4) 50%, rgba(var(--smoke), .1)); }
.lg-sq { display: inline-block; width: 8px; height: 12px; background: var(--c); }
.tmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
.tmeta > div { display: flex; align-items: center; gap: 8px; }
.tsum { margin-left: auto; font-weight: 600; }

@media (max-width: 1280px) {

}
@media (max-width: 900px) {

  .fgrid, .three { grid-template-columns: minmax(0, 1fr); }
  .barw { display: none; }

  .asn { max-width: 22ch; }
  table.hops th, table.hops td { padding: 0 6px; }
}
@media (max-width: 720px) {
  .rail { grid-template-columns: minmax(0, 1fr); }

// ---------- group tree ----------
function tree(list) {
  const root = { name: "", path: "", kids: new Map(), items: [] };
  for (const x of list) {
    let node = root, path = "";
    for (const part of x.group.split(" / ")) {
      path = path ? `${path} / ${part}` : part;
      if (!node.kids.has(part)) node.kids.set(part, { name: part, path, kids: new Map(), items: [] });
      node = node.kids.get(part);
      node.items.push(x);
    }
    root.items.push(x);
  }
  return root;
}

  for (const x of list) c[x.status]++;

}
const byWorst = (a, b) => SEV[worstOf(b.items)] - SEV[worstOf(a.items)] || a.name.localeCompare(b.name, LOC, { numeric: true });

const nz = (v, d = -1) => v == null ? d : v;
const SORTS = {
  sev: (a, b) => SEV[b.status] - SEV[a.status] || nz(b.loss) - nz(a.loss) || above(b) - above(a) || a.name.localeCompare(b.name, LOC, { numeric: true }),

  base: (a, b) => above(b) - above(a), rc: (a, b) => b.route_changes - a.route_changes || SORTS.sev(a, b),
};
const shownList = () => scoped().filter(passes).sort(SORTS[S.sort] || SORTS.sev);
function groupsOf(list) {
  const m = new Map();

}

  const p = S.det?.points[i];
  if (!p) return;
  const lastTs = S.det.points[S.det.points.length - 1][0];
  pickMoment(p[0] >= lastTs ? null : p[0] + S.det.bucket - 1);
}

// ---------- traceroute ----------
function ipCell(h, after = "") {
  if (!h) return '<span class="dim">—</span>';
  if (!h.ip) return `<span class="ipc dim" title="${t("silentTip")}">???</span>`;
  const name = h.asn ? (S.trace?.asn_names || {})[h.asn] : null;
  const as = h.asn ? `<span class="asn" title="${esc(name || h.asn)}">${esc(h.asn)}${name ? " · " + esc(asName(name)) : ""}</span>` : "";
  return `<span class="ipc">${esc(h.ip)}</span>${after}${as}`;
}
function lossCell(h, origin) {
  if (!h || !h.ip) return '<span class="dim">—</span>';
  if (h.loss <= 0) return `<span class="dim">0${NB}%</span>`;
  const real = origin != null && h.ttl >= origin;
  const tag = real ? (h.ttl === origin ? `<span class="tag tag-real" title="${t("realTip")}">${icon("down")}<span class="tl">${t("realStarts")}</span></span>` : "") : `<span class="tag" title="${t("rlTip")}">rate-limit</span>`;
  return `<span class="${real ? "dl" : ""}">${pct(h.loss)}</span>${tag}`;
}
function renderTrace() {
  const el = $("#trace");
  if (!el) return;
  const tr = S.trace;
  const head = `<div class="ph"><h2>Traceroute · mtr</h2><span class="grow"></span>
    <span class="seg" role="group" aria-label="${t("compareAria")}"><button data-vs="route" aria-pressed="${S.vs === "route"}">${t("vsRoute")}</button><button data-vs="round" aria-pressed="${S.vs === "round"}">${t("vsRound")}</button></span></div>`;
  if (!tr) { el.innerHTML = head + `<div class="empty">${t("loading")}</div>`; return; }
  if (tr.error) { el.innerHTML = head + empty(t("traceErr"), `<button class="btn" data-act="retrace">${t("tryAgain")}</button>`); return; }
  if (!tr.cur) { el.innerHTML = head + empty(t("noTracesT"), t("noTracesB")); return; }
  const { cur, prev, rows } = tr;
  const n = st => rows.filter(r => r.state === st).length;
  const nc = n("changed"), na = n("added"), nr = n("removed"), nu = n("unknown");
  const lastOf = hops => [...hops].reverse().find(h => h.ip && h.avg != null);
  const dc = lastOf(cur.hops), dp = prev && lastOf(prev.hops);
  const dDest = dc && dp && dc.ip === dp.ip ? dc.avg - dp.avg : null;
  const tail = cur.hops[cur.hops.length - 1];
  const stuck = tail && !tail.ip && dc ? t("stuck", dc.ttl, esc(dc.ip)) : "";
  const asPath = hops => [...new Set(hops.map(h => h.asn).filter(Boolean))].join(" ");
  const asMoved = prev && asPath(prev.hops) && asPath(cur.hops) && asPath(prev.hops) !== asPath(cur.hops);
  const parts = [nc && t("hopsChanged", nc), na && t("nNew", na), nr && t("nGone", nr), nu && t("nSilent", nu), asMoved && t("asChanged")].filter(Boolean);
  const sum = !prev ? t("noPrev") : (parts.length ? parts.join(" · ") : t("sameHops")) + (dDest != null ? ` · ${t("dest")} ${dDest >= 0 ? "+" : "−"}${ms(Math.abs(dDest))}${NB}ms` : "");
  const maxAvg = Math.max(1, ...cur.hops.map(h => h.avg || 0));
  const lines = routeLines(rows, cur, prev);
  const differs = prev && rows.some(r => r.state && r.state !== "same" && r.state !== "unknown");   // else "before" repeats "now"
  const body = rows.map(r => {
    const c = r.cur, p = r.prev, dv = c?.avg != null && p?.avg != null ? c.avg - p.avg : null;
    return `<tr class="r-${r.state || "none"}" title="${r.state ? esc(t(r.state === "same" ? "sameHop" : r.state)) : ""}"><td class="num mono">${r.ttl}</td><td class="rm">${lines[rows.indexOf(r)]}</td>
      ${differs ? `<td class="hide-s">${ipCell(p)}</td>` : ""}
      <td>${ipCell(c)}</td><td class="num">${lossCell(c, cur.origin)}</td>
      <td class="num mono" ${c?.sd != null ? `title="${t("cSd")} ${msU(c.sd)}"` : ""}>${c?.avg != null ? `<span class="barw"><span class="bar" style="width:${Math.max(2, c.avg / maxAvg * 100)}%"></span></span>${msU(c.avg)}` : '<span class="dim">—</span>'}</td>
      ${prev ? `<td class="num mono hide-s${dv != null && Math.abs(dv) >= 10 ? " dl" : ""}">${dv == null ? "—" : `${dv >= 0 ? "+" : "−"}${ms(Math.abs(dv))}`}</td>` : ""}</tr>`;
  }).join("");
  el.innerHTML = head + `<div class="tmeta">
      <div><span class="cap">${t("now")}</span>${rb(cur.label, cur.route)}<b class="mono">${at(cur.ts)}</b>${S.sel ? `<button class="link" data-act="latest">${t("goLatest")}</button>` : `<span class="dim">${t("latest")}</span>`}</div>
      <div><span class="cap">${t("before")}</span>${prev ? `${rb(prev.label, prev.route)}<span class="mono">${at(prev.ts)}</span>` : '<span class="dim">—</span>'}</div>
      <div class="tsum">${sum}</div></div>
    ${stuck ? `<p class="note bad">${icon("down")} ${stuck}</p>` : ""}${tr.fallback ? `<p class="note">${t("fallback")}</p>` : ""}
    <div class="tw"><table class="hops"><thead><tr><th class="num"><button>#</button></th><th class="rm" aria-hidden="true"></th>${differs ? `<th class="hide-s"><button>${t("before")}</button></th>` : ""}<th><button>${t("now")}</button></th>
      <th class="num"><button>${t("cLoss")}</button></th><th class="num"><button>${t("cAvg")}</button></th>
      ${prev ? `<th class="num hide-s"><button>${t("cDelta")}</button></th>` : ""}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="foot">${t("foot")}</p>`;
}
// One cell per hop: the current route's line and, when it differs, the previous route's line beside it. Where
// both pass through the same router they run as one; where they part they run side by side; a station marks
// each hop (hollow when silent, red where real loss starts). Rows are a fixed height, so the cells join up.
function routeLines(rows, cur, prev) {
  const W = 46, H = 46, MID = 23, A = 15, B = 31;
  const cc = `var(${routeVar(cur.route)})`, pc = prev ? `var(${routeVar(prev.route)})` : cc;
  const merged = r => !prev || r.state === "same" || r.state === "unknown";
  const xs = rows.map(r => ({ now: r.cur ? (merged(r) ? MID : B) : null, was: prev && r.prev ? (merged(r) ? MID : A) : null }));
  const seg = (k, i, col) => {
    const x = xs[i][k];
    if (x == null) return "";
    const up = i > 0 && xs[i - 1][k] != null ? (xs[i - 1][k] + x) / 2 : null, down = i < rows.length - 1 && xs[i + 1][k] != null ? (xs[i + 1][k] + x) / 2 : null;
    return (up != null ? `<path d="M${up} 0L${x} ${H / 2}"/>` : "") + (down != null ? `<path d="M${x} ${H / 2}L${down} ${H}"/>` : "");
  };
  return rows.map((r, i) => {
    const st = (x, h, col) => {
      if (x == null || !h) return "";
      const last = i === rows.length - 1 || (h === r.cur && !rows.slice(i + 1).some(q => q.cur));
      if (!h.ip) return `<circle cx="${x}" cy="${H / 2}" r="2.5" fill="var(--bg)" stroke="var(--ink-3)" stroke-width="1.2"/>`;
      const origin = h === r.cur && cur.origin === h.ttl;
      return `<circle cx="${x}" cy="${H / 2}" r="${last ? 5.5 : 4}" fill="${origin ? "var(--down)" : "var(--bg)"}" stroke="${origin ? "var(--down)" : col}" stroke-width="2"/>`;
    };
    const sameStation = xs[i].now != null && xs[i].now === xs[i].was;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke-width="3" stroke-linecap="round"><g stroke="${pc}">${seg("was", i)}</g><g stroke="${cc}">${seg("now", i)}</g></g>
      ${sameStation ? "" : st(xs[i].was, r.prev, pc)}${st(xs[i].now, r.cur, cc)}</svg>`;
  });
}
function renderHops() {
  const el = $("#hopsp"), tr = S.trace;
  if (!el) return;
  const head = `<div class="ph"><h2>${t("hopsTitle")}</h2><span class="grow"></span>`;
  if (!tr?.cur) { el.innerHTML = head + `</div><div class="empty" style="padding:24px">${t("loading")}</div>`; return; }
  const hops = tr.cur.hops, prev = new Map((tr.prev?.hops || []).map(h => [h.ttl, h.avg]));
  const W = 340, H = 180, l = 34, r = 8, tp = 10, b = 22, n = hops.length;
  const max = Math.max(1, ...hops.map(h => h.avg || 0), ...[...prev.values()].filter(Boolean)) * 1.1;
  const bw = (W - l - r) / n, Y = v => tp + (1 - v / max) * (H - tp - b);
  let svg = niceTicks(max).filter(v => v <= max).map(v => `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${l - 6}" y="${Y(v) + 3}" text-anchor="end" font-size="9.5" fill="var(--ink-3)" font-family="Plex Mono, monospace">${fmtTick(v)}</text>`).join("");
  hops.forEach((h, i) => {
    const x = l + i * bw + bw * .18, w = bw * .64, origin = tr.cur.origin === h.ttl;
    svg += h.avg != null
      ? `<rect x="${x}" y="${Y(h.avg)}" width="${w}" height="${Y(0) - Y(h.avg)}" rx="2" fill="var(${origin ? "--down" : "--accent"})" opacity="${origin ? .95 : .7}"><title>${h.ttl}: ${esc(h.ip || "???")} ${msU(h.avg)}</title></rect>`
      : `<text x="${x + w / 2}" y="${Y(0) - 4}" text-anchor="middle" font-size="10" fill="var(--ink-3)">?</text>`;
    const pv = prev.get(h.ttl);
    if (pv != null) svg += `<line x1="${x - 2}" x2="${x + w + 2}" y1="${Y(pv)}" y2="${Y(pv)}" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>`;
    svg += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="Plex Mono, monospace">${h.ttl}</text>`;
  });
  el.innerHTML = head + `<span class="clegend"><span><i class="lg-sq" style="--c:var(--accent)"></i>${t("hopsNow")}</span>${tr.prev ? `<span><i class="lg-line"></i>${t("hopsBefore")}</span>` : ""}</span></div>
    <div class="pb"><svg class="hopchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("hopsTitle")}">${svg}</svg></div>`;
}
function renderRaw() {
  const d = S.det;
  if (!d) return;
  const rows = [...d.points].reverse().map(p => { const s = p[4], seg = segAt(p[0]);
    return `<tr><td class="mono">${at(p[0])}</td><td class="num mono">${msU(p[1])}</td><td class="num mono">${s.length ? msU(s[0]) : "—"}</td><td class="num mono">${s.length ? msU(s[s.length - 1]) : "—"}</td>
      <td class="num mono">${pct(p[2])}</td><td class="num mono">${msU(p[3])}</td><td>${seg ? esc(seg.label) : "—"}</td></tr>`; }).join("");
  $("#raw").innerHTML = `<div class="tw"><table><thead><tr><th><button>${t("cTime")}</button></th><th class="num"><button>${t("cMedian")}</button></th><th class="num"><button>${t("cMin")}</button></th>
    <th class="num"><button>${t("cMax")}</button></th><th class="num"><button>${t("cLoss")}</button></th><th class="num"><button>${t("cJitter")}</button></th><th><button>${t("route")}</button></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---------- events ----------
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tedit],[data-tog],[data-act],[data-src],[data-brange],[data-drange],[data-view],[data-mode],[data-tl],[data-vs],[data-fst],[data-fp],[data-frc],[data-st],[data-rc],[data-g],[data-sortk],[data-ids],[data-here],[data-open]");
  if (!b) { if (document.body.classList.contains("drawer") && !e.target.closest(".side")) document.body.classList.remove("drawer"); return; }
  const ds = b.dataset;
  if (ds.tog != null) { S.open.has(ds.tog) ? S.open.delete(ds.tog) : S.open.add(ds.tog); store.set("treeOpen", JSON.stringify([...S.open])); renderSide(); return; }
  if (ds.act === "drawer") { $("#menuBtn").setAttribute("aria-expanded", document.body.classList.toggle("drawer")); return; }
  if (ds.act === "theme") { const v = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = v; store.set("theme", v); themeBtn(); S.id ? (drawChart(), renderHops()) : renderDash(); return; }
  if (ds.act === "lang") { store.set("lang", LANG === "pt" ? "en" : "pt"); location.reload(); return; }
  if (ds.act === "retry") { refresh(); return; }
  if (ds.act === "tadd") { editTarget(null, S.tpage ? "" : S.f.g); return; }
  if (ds.act === "tcancel") { closeEditor(); return; }
  if (ds.act === "treload") { loadTargets(); return; }
  if (ds.act === "tdel") { if (confirm(t("tConfirm", TG.edit.name))) saveTarget("delete"); return; }
  if (ds.tedit) { editTarget(ds.tedit); return; }
  if (ds.act === "clearq") { $("#q").value = ""; setFilters(f => { f.q = ""; }); return; }
  if (ds.act === "clearids") { setFilters(f => { f.ids.clear(); }); return; }
  if (ds.act === "clear") { $("#q").value = ""; setFilters(f => { f.st.clear(); f.p.clear(); f.ids.clear(); f.rc = false; f.q = ""; }); return; }
  if (ds.act === "grouped") { S.grouped = !S.grouped; store.set("grouped", S.grouped ? "1" : "0"); renderDash(); return; }
  if (ds.act === "morecards") { S.cards += 60; renderDash(); return; }
  if (ds.act === "cmp") { S.showCmp = !S.showCmp; store.set("cmp", S.showCmp ? "1" : "0"); loadDetail(); return; }
  if (ds.act === "latest") { pickMoment(null); return; }
  if (ds.act === "overview") { e.preventDefault(); toOverview(); return; }
  if (ds.act === "retrace") { loadTrace(); return; }
  if (ds.src) { S.src = ds.src; store.set("src", S.src); S.trace = null; S.traceFor = undefined; S.cmp = null; refresh(); return; }
  if (ds.brange) { S.range = +ds.brange; store.set("brange", S.range); loadBoard(); return; }
  if (ds.drange) { S.drange = +ds.drange; store.set("range", S.drange); S.hover = null; $("#tip").hidden = true; loadDetail(); return; }
  if (ds.view) { S.view = ds.view; store.set("view", S.view); renderDash(); return; }
  if (ds.mode) { S.mode = ds.mode; store.set("hmode", S.mode); renderDash(); return; }
  if (ds.tl) { S.tl = ds.tl; renderDash(); return; }
  if (ds.vs) { S.vs = ds.vs; loadTrace(); return; }
  if (ds.sortk) { S.sort = ds.sortk; store.set("sort", S.sort); renderDash(); return; }
  if (ds.fst) { setFilters(f => f.st.has(ds.fst) ? f.st.delete(ds.fst) : f.st.add(ds.fst)); return; }
  if (ds.fp) { setFilters(f => f.p.has(ds.fp) ? f.p.delete(ds.fp) : f.p.add(ds.fp)); return; }
  if (ds.frc != null) { setFilters(f => { f.rc = !f.rc; }); return; }
  if (ds.st) { setFilters(f => { f.st = new Set(ds.st.split(",")); }); return; }
  if (ds.rc) { setFilters(f => { f.rc = true; }); return; }
  if (ds.ids) { setFilters(f => { f.ids = new Set(ds.ids.split(",")); f.g = ""; f.st.clear(); }); return; }
  if (ds.g != null) { e.preventDefault(); if (ds.g) S.open.add(ds.g); setFilters(f => { f.g = ds.g; f.ids.clear(); }); document.body.classList.remove("drawer"); return; }
  if (ds.here) { pickMoment(+ds.at); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (ds.open) { openTarget(ds.open, ds.at ? +ds.at : null); return; }
});
document.addEventListener("submit", e => { if (e.target.id === "tform") { e.preventDefault(); saveTarget("save"); } });
document.addEventListener("input", e => {
  if (e.target.id !== "tq") return;
  TG.q = e.target.value;
  renderTargetList();
});
document.addEventListener("change", e => { if (e.target.id === "sort") { S.sort = e.target.value; store.set("sort", S.sort); renderDash(); } });
document.addEventListener("scroll", e => { if (e.target.id === "hmScroll") { S.hm = null; $("#tip").hidden = true; drawHeat(); } }, true);
const view = $("#view");
view.addEventListener("pointermove", e => {
  if (e.target.id === "hm") {
    const hit = heatHit(e);
    if (hit?.row !== S.hm?.row || hit?.cell !== S.hm?.cell) { S.hm = hit; drawHeat(); }
    heatTip(e, hit);
    return;
  }
  if (e.target.id === "chart" && S.geo && S.det?.points.length) {
    const x = e.clientX - e.target.getBoundingClientRect().left;
    setHover(x < S.geo.x0 - 4 || x > S.geo.x1 + 4 ? null : nearest(x), e);
  }
});
view.addEventListener("pointerout", e => {
  if (e.target.id === "hm") { S.hm = null; $("#tip").hidden = true; drawHeat(); }
  if (e.target.id === "chart") setHover(null);
});
view.addEventListener("click", e => {
  if (e.target.id === "hm") {
    const hit = heatHit(e);
    if (!hit) return;
    const r = HROWS[hit.row];
    if (r.g != null) { S.shut.has(r.g) ? S.shut.delete(r.g) : S.shut.add(r.g); buildHeat(shownList()); sizeHeat(); drawHeat(); return; }
    $("#tip").hidden = true;
    openTarget(r.x.id, hit.cell != null ? S.b.start + (hit.cell + 1) * S.b.width - 1 : null);
  }
  if (e.target.id === "chart" && S.geo && S.det?.points.length) {
    const x = e.clientX - e.target.getBoundingClientRect().left;
    if (x >= S.geo.x0 - 4 && x <= S.geo.x1 + 4) selectPoint(nearest(x));
  }
});
view.addEventListener("keydown", e => {
  if (e.target.id !== "chart" || !S.det?.points.length) return;
  const n = S.det.points.length, cur = S.hover ?? n - 1, step = e.shiftKey ? 12 : 1;
  if (e.key === "ArrowLeft") setHover(Math.max(0, cur - step));
  else if (e.key === "ArrowRight") setHover(Math.min(n - 1, cur + step));
  else if (e.key === "Enter" || e.key === " ") selectPoint(cur);
  else return;
  e.preventDefault();
});
view.addEventListener("focusout", e => { if (e.target.id === "chart") setHover(null); });
view.addEventListener("toggle", e => { if (e.target.id === "rawd" && e.target.open) renderRaw(); }, true);
let qTimer = 0;
$("#q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => setFilters(f => { f.q = e.target.value; }), 150); });
$("#tdlg").addEventListener("close", () => { TG.edit = null; });
$("#tdlg").addEventListener("click", e => { if (e.target.id === "tdlg") closeEditor(); });   // the backdrop
document.addEventListener("keydown", e => {
  if ($("#tdlg").open) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); $("#q").focus(); }
  else if (e.key === "Escape" && typing) $("#q").blur();
  else if (e.key === "Escape" && S.id) toOverview();
});
window.addEventListener("hashchange", route);
let rsz = 0;
addEventListener("resize", () => {
  cancelAnimationFrame(rsz);
  rsz = requestAnimationFrame(() => {
    if (S.id) drawChart();
    else if (S.view === "heat") { sizeHeat(); drawHeat(); }
    else if (S.view === "cards") document.querySelectorAll("[data-card]").forEach(el => S.minis[el.dataset.card] && drawMini(el));
  });
});
function themeBtn() {
  const dark = document.documentElement.dataset.theme === "dark";
  $("#themeBtn").innerHTML = dark
    ? '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
    : '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3z" fill="currentColor"/></svg>';
  $("#themeBtn").innerHTML += dark ? t("themeDark") : t("themeLight");
  $("#themeBtn").title = dark ? t("themeLight") : t("themeDark");
}
$("#q").placeholder = t("search");
$("#banner span").textContent = t("offline");
$("#banner button").textContent = t("retry");
$("#lang").textContent = t("langBtn");
$("#menuBtn").textContent = t("menu");
$("#lang").title = t("langTitle");
$("#out").textContent = t("signOut");
themeBtn();
route();
refresh();
setInterval(refresh, 60000);
setInterval(tick, 5000);
