name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a commit, not a tag that can move; Dependabot keeps them current.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python test_smoketrace.py

  demo:
    # the whole thing end to end: start the demo, ask every endpoint, and check the page's script parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
      - name: Start the demo and ask it
        run: |
          python smoketrace.py --demo --port 8099 &
          for i in $(seq 30); do curl -fs 127.0.0.1:8099/api/overview > /dev/null && break; sleep 1; done
          curl -fs 127.0.0.1:8099/ | grep -q "<title>smoketrace</title>"
          python - <<'EOF'
          import json, urllib.request
          get = lambda p: json.load(urllib.request.urlopen("http://127.0.0.1:8099" + p))
          ov = {t["name"]: t for t in get("/api/overview")["targets"]}
          assert len(ov) == 6 and ov["VPS Frankfurt"]["status"] == "down", ov
          assert ov["VPS Frankfurt"]["by_source"] == {"local": "down", "porto": "down"}, ov
          assert get(f"/api/overview?src=porto")["source"] == "porto"
          cf = ov["Cloudflare DNS"]["id"]
          d = get(f"/api/target?id={cf}&range=86400")
          assert len(d["points"]) >= 280, len(d["points"])
          assert [s["label"] for s in d["segments"] if s["change"]] == ["B", "A"], d["segments"]
          tr = get(f"/api/trace?id={cf}")
          assert (tr["cur"]["label"], tr["prev"]["label"]) == ("A", "B")
          assert {r["state"] for r in tr["rows"]} >= {"same", "changed"}, tr["rows"]
          print("demo ok")
          EOF
      - name: The page's script parses
        run: |
          python -c "import re; s = open('index.html', encoding='utf-8').read(); open('page.js', 'w', encoding='utf-8').write(re.search(r'<script>(.*)</script>', s, re.S).group(1))"
          node --check page.js

  probes:
    # the real probes, not the demo: one round of fping and mtr against the runner itself
    # (hosted runners cannot ping the internet, but loopback is enough to prove the commands and the parsing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: sudo apt-get update -q && sudo apt-get install -yq fping mtr-tiny
      - name: One real round against 127.0.0.1
        run: |
          sudo python3 - <<'EOF'
          import json, os, tempfile, time
          import smoketrace as st
          db = os.path.join(tempfile.mkdtemp(), "t.db")
          st.init_db(db, "ci")
          lo = {"id": "lo", "group": "LAN", "name": "lo", "host": "127.0.0.1"}
          ts = int(time.time()) // st.STEP * st.STEP
          st.store(db, *st.round_rows("ci", ts, *st.probe_round([lo], ts, st.fping, st.mtr)), ts)
          with st.db_open(db) as c:
              s = st.summary(c, "ci", lo, int(time.time()))
              tr = st.trace_detail(c, "ci", "lo", None, "route")
          print(json.dumps({k: s[k] for k in ("status", "median", "loss", "jitter")}), tr["cur"]["hops"])
          assert s["status"] == "ok" and s["loss"] == 0 and s["median"] is not None, s
          assert tr["cur"]["hops"][-1]["ip"] == "127.0.0.1" and tr["cur"]["hops"][-1]["loss"] == 0, tr
          EOF

  container:
    # the image as shipped, configured from a SmokePing config: a server and a remote agent (a SmokePing slave with
    # its secret), each with only NET_RAW, a read-only root and no-new-privileges, probing loopback for real;
    # the agent takes its targets and its pings from the server and its rounds must reach it
    needs: [test, demo, probes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: docker build -t smoketrace:test .
      - name: Start a server and an agent
        run: |
          # root-owned like the one compose creates: root in the container has no CAP_DAC_OVERRIDE
          sudo mkdir -p data/smokeping
          sudo tee data/smokeping/config <<'EOF'
          *** Slaves ***
          secrets = secrets
          +edge

          *** Database ***
          step = 300
          pings = 10

          *** Targets ***
          probe = FPing
          + LAN
          slaves = edge
          ++ Loopback
          host = 127.0.0.1
          EOF
          echo 'edge:edge-secret-0123456789' | sudo tee data/smokeping/secrets > /dev/null
          hard="--network host --read-only --cap-drop ALL --cap-add NET_RAW --security-opt no-new-privileges:true"
          docker run -d --name server $hard -v "$PWD/data:/data" -e NAME=ci -e SMOKEPING_CONFIG=/data/smokeping/config smoketrace:test
          for i in $(seq 30); do curl -fs 127.0.0.1:8099/livez && break; sleep 1; done
          docker run -d --name agent $hard -e SERVER=http://127.0.0.1:8099 -e TOKEN=edge-secret-0123456789 smoketrace:test
      - name: Both sources see loopback, with the config's pings
        run: |
          for i in $(seq 90); do
            curl -fs "127.0.0.1:8099/api/overview?src=edge" > ov.json && curl -fs "127.0.0.1:8099/api/target?id=lan-loopback&src=edge&range=3600" > edge.json && python3 - <<'EOF' && exit 0
          import json, sys
          t = json.load(open("ov.json"))["targets"][0]
          edge = json.load(open("edge.json"))
          ok = t["by_source"] == {"ci": "ok", "edge": "ok"} and t["median"] is not None
          sys.exit(0 if ok and edge["pings"] == 10 and len(edge["points"][-1][4]) == 10 else 1)
          EOF
            sleep 2
          done
          cat ov.json edge.json; exit 1
      - name: Docker reports the server healthy
        run: |
          for i in $(seq 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' server)" = healthy ] && exit 0; sleep 2; done
          docker inspect -f '{{json .State.Health}}' server; exit 1
      - if: always()
        run: docker logs server; docker logs agent

  image:
    needs: [container]
    # images are only published from main (latest) and version tags
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # a software bill of materials and build provenance travel with the image
          sbom: true
          provenance: mode=max

  release:
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Publish the CHANGELOG section as the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          # a tag without its CHANGELOG section is a release nobody can read: refuse it
          test -s notes.md || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
