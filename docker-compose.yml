# smoketrace server: probes from this machine, keeps the history, sends alerts and serves the page on port 8099.
#
#   mkdir smoketrace && cd smoketrace
#   curl -O https://raw.githubusercontent.com/ST-DEVPT/smoketrace/main/docker-compose.yml
#   (change PASSWORD below)
#   docker compose up -d
#
# Then open http://<this-host>:8099, sign in, and add targets on the Targets page.
# Update: docker compose pull && docker compose up -d
#
# Every option is listed below. Lines starting with # are off; remove the # to use one.

services:
  smoketrace:
    image: ghcr.io/st-devpt/smoketrace:latest      # or pin a version: ghcr.io/st-devpt/smoketrace:0.14
    container_name: smoketrace
    restart: unless-stopped
    network_mode: host            # traceroutes start at your real gateway, not at Docker's bridge
    volumes:
      - ./data:/data              # the database and your targets: back up this folder
      # Coming from SmokePing? Mount its config folder (read-only) and set SMOKEPING_CONFIG below.
      # SmokePing in a container (linuxserver/smokeping): its config folder, e.g. /DATA/smokeping/config
      # - /etc/smokeping:/etc/smokeping:ro
    environment:
      TZ: Europe/Lisbon           # the time zone for the logs

      # --- the basics ---------------------------------------------------------------------------------------
      NAME: home                  # what the page calls this server's own probe (letters, digits, _ and -)
      PASSWORD: change-me         # the sign-in for the page and its API; needed to edit targets on the page
      # PUBLIC_URL: https://smoketrace.example.com   # this page's address, so alerts link to it
      # PORT: 8099                # the port the page listens on

      # --- where the targets come from ------------------------------------------------------------------------
      # Add and edit them on the Targets page; they are kept in /data/targets.json. The first start writes an
      # example /data/targets.ini, which the page takes over at its first change. Or read SmokePing's config as it is
      # (the page then takes over its targets the same way; its agents, round length and pings still apply):
      # SMOKEPING_CONFIG: /etc/smokeping

      # --- the database -----------------------------------------------------------------------------------------
      # SQLite in /data/smoketrace.db by default: nothing to set up. Or MariaDB (or MySQL), on this host or another:
      # DB: mariadb://smoketrace@127.0.0.1:3306/smoketrace
      # DB_PASSWORD: the-database-password     # or in the address: mariadb://smoketrace:password@host/smoketrace
      # docker-compose.mariadb.yml runs smoketrace with a MariaDB of its own.

      # --- remote sites (agents) --------------------------------------------------------------------------------
      # One entry per site: name=token. Make a token with:  openssl rand -hex 24
      # The site then runs docker-compose.agent.yml with that same token in TOKEN.
      # name=token@http://site:8100 when the server must fetch from the site instead (the site cannot reach here).
      # AGENTS: porto=paste-a-long-random-token,office=paste-another-one@http://office.lan:8100

      # --- alerts (any or all) ----------------------------------------------------------------------------------
      # DISCORD_WEBHOOK: https://discord.com/api/webhooks/...
      # NTFY_URL: https://ntfy.sh/your-topic
      # WEBHOOK_URL: https://example.com/hook      # a JSON POST for every alert
      # ALERT_ROUTES: "0"         # alerts for status changes only, not route changes
      # LOSS_WARN: "10"           # % lost in a round for a warning (2 of 20 pings)
      # LOSS_CRIT: "20"           # % lost in a round for critical (4 of 20 pings)

      # --- updates -------------------------------------------------------------------------------------------
      # The page says when a new version is out (asked of GitHub every 6 h) and alerts it once. Its Update button
      # calls an updater you run, one that pulls the image and recreates the container (see its docs):
      # UPDATE_URL: https://updater.lan/the-webhook-your-updater-gives-you
      # UPDATE_TOKEN: the-updater-token          # sent as a bearer token, if the updater wants one
      # UPDATE_CHECK: "0"                        # never ask GitHub

      # --- Prometheus ------------------------------------------------------------------------------------------
      # METRICS_TOKEN: another-long-random-token   # /metrics then needs it as a bearer token

      # --- tuning -----------------------------------------------------------------------------------------------
      # STEP: 3m                  # pings every 3 minutes (default 5, or SmokePing's step); agents follow
      # TRACE_STEP: 15m           # a traceroute of each target every 15 minutes (default: every round)
      # TRACE_PARALLEL: "16"      # traceroutes at once (1-64): fewer use less CPU, more trace each target more often
      # ASN: "0"                  # no AS numbers and operator names on hops, no public address for the Sites page
    logging:
      options: {max-size: 10m, max-file: "3"}
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_RAW]            # fping and mtr need raw ICMP, nothing else
    security_opt: ["no-new-privileges:true"]
