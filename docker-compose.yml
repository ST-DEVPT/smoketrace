# The server: probes from this machine, stores everything, serves the dashboard on port 8099.
# First start writes an example data/targets.ini: put your targets in it and `docker compose restart`.
services:
  smoketrace:
    image: ghcr.io/st-devpt/smoketrace:latest
    container_name: smoketrace
    restart: unless-stopped
    network_mode: host            # traceroutes start at your real gateway, not at Docker's bridge
    volumes:
      - ./data:/data              # targets.ini and the database
      # Coming from SmokePing? Read its config as it is (targets, slaves as agents, step and pings):
      # - /etc/smokeping:/etc/smokeping:ro
    environment:
      TZ: Europe/Lisbon
      NAME: home                  # what the dashboard calls this probe
      # SMOKEPING_CONFIG: /etc/smokeping/config
      # Remote agents allowed to push, each with its own long random token (openssl rand -hex 24):
      # AGENTS: porto=paste-a-long-random-token,office=paste-another-one
      # PORT: 8099
    logging:
      options: {max-size: 10m, max-file: "3"}
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_RAW]            # fping and mtr need raw ICMP, nothing else
    security_opt: ["no-new-privileges:true"]
